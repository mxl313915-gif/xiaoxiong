<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小熊乐乐">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#A8D8F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>小熊乐乐</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* Fonts load after the page is already showing. If Google Fonts is slow or unreachable (common on mainland networks) the page simply keeps the system font. */
(function(){try{var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap';document.head.appendChild(l)}catch(e){}})();
</script>
<style>
/* ===== Enhanced visual system ===== */
:root{
  --sky-top:#A8D8F0; --sky-bot:#E8F5E9;
  --grass:#7BC86C; --grass-back:#9DD48A; --grass-deep:#5BA34A;
  --fur:#C48A4F; --fur-in:#F0C49A; --cream:#FFF0D6; --pad:#F0B0A0; --nose:#3B2418;
  --ink:#3D2414; --muted:#7A6350; --panel:#FFF8EC; --panel-2:#F5E8C8; --bubble:#FFFAF0;
  --berry:#E4566B; --honey:#E0A020; --dusk:#4B5BA0; --teal:#2E9E96; --plum:#8A63C8; --sun:#FFD66B;
  --rain:#7AB8E0; --snow:#E8F4FF;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky-bot);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;-webkit-user-select:none;user-select:none}
.sky,.nightbg,.weatherfx{position:absolute;inset:0}
.sky{background:linear-gradient(180deg,var(--sky-top) 0%,#C8E8F5 40%,var(--sky-bot) 100%);transition:background 1.5s}
.nightbg{opacity:0;transition:opacity 1.2s;
  background:
   radial-gradient(circle at 12% 18%,#fff 0 1.6px,transparent 2.6px),
   radial-gradient(circle at 30% 9%,#fff 0 1.2px,transparent 2.2px),
   radial-gradient(circle at 52% 24%,#fff 0 1.8px,transparent 2.8px),
   radial-gradient(circle at 68% 8%,#fff 0 1.3px,transparent 2.3px),
   radial-gradient(circle at 88% 30%,#fff 0 1.6px,transparent 2.6px),
   radial-gradient(circle at 40% 36%,#fff 0 1.2px,transparent 2.2px),
   linear-gradient(#1A2245,#2E3A6A 60%,#4A5A8A)}
.night .nightbg{opacity:1}
.weatherfx{pointer-events:none;z-index:1}
.cloud{position:absolute;left:0;height:34px;width:110px;background:#fff;border-radius:999px;opacity:.95;transition:opacity 1s,filter 1s;animation:drift 80s linear infinite;filter:drop-shadow(0 4px 8px rgba(100,140,180,.15))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48px;height:48px;left:18px;top:-24px}
.cloud::after{width:36px;height:36px;left:56px;top:-16px}
.cloud.c1{top:18%}
.cloud.c2{top:32%;animation-duration:110s;animation-delay:-40s;scale:.75}
.cloud.c3{top:12%;left:40%;animation-duration:95s;animation-delay:-20s;scale:.55;opacity:.7}
.night .cloud{opacity:0}
.rain .cloud{filter:brightness(.85);opacity:.7}
@keyframes drift{from{translate:-180px 0}to{translate:calc(100vw + 60px) 0}}

/* hills with more depth */
.hill{position:absolute;left:-30%;right:-30%;border-radius:50% 50% 0 0/100% 100% 0 0;transition:filter 1.2s,background 1.2s}
.hill.b{bottom:-22%;height:48%;background:linear-gradient(180deg,var(--grass-back),var(--grass-deep));opacity:.9}
.hill.f{bottom:-30%;height:46%;background:linear-gradient(180deg,var(--grass) 0%,#6BB85A 100%)}
.hill.f::before{content:"";position:absolute;inset:0;border-radius:inherit;background:
  radial-gradient(ellipse 8px 5px at 18% 40%,#9DD48A 0 40%,transparent 50%),
  radial-gradient(ellipse 10px 6px at 42% 55%,#9DD48A 0 40%,transparent 50%),
  radial-gradient(ellipse 7px 4px at 65% 35%,#9DD48A 0 40%,transparent 50%),
  radial-gradient(ellipse 9px 5px at 82% 50%,#9DD48A 0 40%,transparent 50%);
  opacity:.6}
.night .hill{filter:brightness(.5) saturate(.7)}
.rain .hill{filter:brightness(.85) saturate(.9)}
.snow .hill{filter:brightness(1.05) saturate(.7)}

/* flowers on ground */
.flowers{position:absolute;left:0;right:0;bottom:8%;height:18%;pointer-events:none;transition:opacity 1.2s}
.fl{position:absolute;font-size:14px;opacity:.85;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

.stage-in{position:absolute;inset:0}
.sun,.moon{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;width:48px;height:48px;border-radius:50%;transition:opacity 1s,transform 1s}
.sun{background:radial-gradient(circle at 35% 35%,#FFE9A0,#FFD66B 60%,#F0B830);box-shadow:0 0 0 12px rgba(255,214,107,.28),0 0 40px rgba(255,200,80,.35)}
.moon{background:radial-gradient(circle at 40% 40%,#FFF8E8,#F0E6C8);box-shadow:inset -10px -5px 0 #DDD0AC;opacity:0}
.night .sun{opacity:0;transform:scale(.6)}
.night .moon{opacity:1}
.rain .sun,.snow .sun{opacity:.4}
/* night always wins over weather */
.stage.night .sun{opacity:0}
.stage.night .cloud{opacity:0}
.stage.night .hill{filter:brightness(.5) saturate(.7)}
.stage.night .flowers{opacity:.3}

/* weather particles */
.drop,.flake{position:absolute;pointer-events:none;will-change:transform}
.drop{width:2px;height:14px;background:linear-gradient(transparent,rgba(140,190,230,.7));border-radius:2px;animation:fall linear infinite}
.flake{width:8px;height:8px;background:#fff;border-radius:50%;opacity:.9;box-shadow:0 0 4px #fff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}

/* top chips */
.hud,.ghud{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:stretch;z-index:4}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,250,239,.96);border-radius:999px;padding:5px 11px;font:400 17px/1.2 var(--display);box-shadow:0 3px 0 rgba(74,44,26,.12),0 1px 8px rgba(0,0,0,.04);color:var(--ink);white-space:nowrap;backdrop-filter:blur(6px)}
.pill svg{width:18px;height:18px;flex:none}
.pill.pop{animation:pillpop .5s ease-out}
@keyframes pillpop{40%{scale:1.18}}
.stat{flex:1;min-width:0;background:rgba(255,250,239,.96);border-radius:14px;padding:4px 8px 5px;font-size:11px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 rgba(74,44,26,.12);backdrop-filter:blur(6px)}
.stat.low span{color:var(--berry)}
.bar{display:block;height:6px;border-radius:4px;background:#EBDCC0;overflow:hidden;margin-top:2px}
.bar b{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .5s}
.ghud{justify-content:space-between;align-items:center}
.ghud .grow{flex:1}
.xbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,250,239,.96);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(74,44,26,.12);flex:none;touch-action:manipulation}
.xbtn svg{width:18px;height:18px}
.xbtn.sm{width:36px;height:36px;align-self:center}
.xbtn:focus-visible,.chip:focus-visible,.card:focus-visible,.key:focus-visible{outline:3px solid var(--berry);outline-offset:3px}

.bubble{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:max-content;max-width:min(80%,340px);box-sizing:border-box;padding:10px 18px;background:var(--bubble);color:var(--ink);border-radius:24px;font:400 20px/1.35 var(--display);text-align:center;box-shadow:0 5px 0 rgba(74,44,26,.12),0 2px 12px rgba(0,0,0,.06);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:18px;height:18px;background:var(--bubble);transform:translateX(-50%) rotate(45deg);border-radius:0 0 5px 0;box-shadow:3px 3px 0 rgba(74,44,26,.06)}
.bearwrap{position:absolute;left:50%;bottom:2%;translate:-50% 0;transform:translateX(var(--bx,0px));height:min(68%,520px);aspect-ratio:400/480;max-width:100%;transition:height .45s ease}
.mini .bearwrap{height:min(34%,250px)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.it{position:absolute;left:0;top:0;width:56px;height:56px;will-change:transform}
.it svg{width:100%;height:100%;display:block}
.bub{position:absolute;left:0;top:0;border-radius:50%;pointer-events:auto;touch-action:none;cursor:pointer;will-change:transform;border:2px solid rgba(255,255,255,.85)}
.bub.gold{border-color:#fff6c8}
.bub.pop{animation:popb .22s ease-out forwards}
@keyframes popb{to{scale:1.5;opacity:0}}
.ft{position:absolute;font:400 24px var(--display);color:#fff;text-shadow:0 2px 0 rgba(74,44,26,.4);animation:ftup .9s ease-out forwards;white-space:nowrap}
@keyframes ftup{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -46px}}
.foam{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,rgba(255,255,255,.78) 60%,rgba(190,225,245,.75));border:2px solid rgba(255,255,255,.9);animation:foam 1.3s ease-out forwards}
@keyframes foam{from{opacity:1;scale:1}to{opacity:0;translate:0 -46px;scale:1.35}}
.collect{position:absolute;width:60px;height:60px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;touch-action:manipulation;animation:floaty 2.5s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.collect svg{width:46px;height:46px}
.collect span{font-size:38px;line-height:1}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -10px}}
.collect.pop{animation:popb .3s ease-out forwards}
.bird{position:absolute;width:68px;height:52px;pointer-events:auto;cursor:pointer;touch-action:manipulation;z-index:3;transition:filter .2s}
.bird:active{filter:brightness(1.2)}
.result{position:absolute;left:50%;top:42%;translate:-50% -50%;width:min(86%,320px);box-sizing:border-box;background:var(--bubble);border-radius:26px;padding:20px 18px 16px;text-align:center;box-shadow:0 8px 0 rgba(74,44,26,.14),0 4px 24px rgba(0,0,0,.08);z-index:6;animation:rin .35s ease-out}
@keyframes rin{from{opacity:0;scale:.88}}
.result h2{margin:0 0 4px;font:400 28px var(--display)}
.result p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.rstars{display:inline-flex;align-items:center;gap:8px;font:400 30px var(--display);color:var(--honey);margin-bottom:12px}
.rstars svg{width:32px;height:32px}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* bear */
#bear{width:100%;height:100%;display:block;overflow:visible;-webkit-tap-highlight-color:transparent;--lv:0;transform:rotate(var(--lean,0deg));transform-origin:50% 95%}
#bear [data-hit]{cursor:pointer;touch-action:manipulation;outline:none}
#bear [data-hit]:focus-visible{outline:3px solid var(--berry);outline-offset:4px}
.fur{fill:var(--fur)} .furin{fill:var(--fur-in)} .cream{fill:var(--cream)} .padc{fill:var(--pad)}
.ink{fill:var(--nose)} .line{fill:none;stroke:var(--nose);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.shade{fill:rgba(46,70,32,.18)}
.blush{fill:#F08C84;opacity:.55}
#bearAll{transform-box:view-box;transform-origin:200px 455px}
#bearAll.jump{animation:jump .7s ease-in-out}
#bearAll.shake{animation:shake .5s ease-in-out}
#bearAll.dance{animation:dance 1.2s ease-in-out}
@keyframes jump{0%{transform:scale(1)}15%{transform:scale(1.06,.92)}45%{transform:translateY(-38px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.05,.94)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:rotate(-2.5deg)}40%{transform:rotate(2.5deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1.5deg)}}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-6deg) translateY(-8px)}40%{transform:rotate(6deg) translateY(0)}60%{transform:rotate(-5deg) translateY(-6px)}80%{transform:rotate(4deg) translateY(0)}}
#bodyG{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.sleep #bodyG{animation-duration:5s}
@keyframes breathe{50%{transform:scale(1.02,1.03)}}
#belly{transform-box:fill-box;transform-origin:center}
#belly.jig{animation:jig .7s ease-in-out}
@keyframes jig{25%{transform:scale(1.1,.94)}50%{transform:scale(.95,1.07)}75%{transform:scale(1.04,.98)}}
#head{transform-box:view-box;transform-origin:200px 255px;transition:transform .3s ease}
.hearing #head{transform:rotate(-5deg)}
.sleep #head{transform:rotate(5deg) translateY(9px)}
#head.nod{animation:nod .8s ease-in-out}
#head.bob{animation:bob .45s ease-in-out}
@keyframes nod{0%,100%{transform:translateY(0)}25%{transform:translateY(14px) rotate(2deg)}50%{transform:translateY(0)}75%{transform:translateY(12px)}}
@keyframes bob{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg) translateY(4px)}70%{transform:rotate(6deg) translateY(4px)}}
#earL,#earR{transform-box:fill-box;transform-origin:50% 75%;transform:scale(calc(1 + var(--lv) * .28));transition:transform .07s linear}
#armL{transform-box:view-box;transform-origin:112px 268px}
#armR{transform-box:view-box;transform-origin:288px 268px}
#armL.wave{animation:waveL 1.4s ease-in-out}
#armR.wave{animation:waveR 1.4s ease-in-out}
#armL.hop{animation:hopL .45s ease-in-out}
#armR.hop{animation:hopR .45s ease-in-out}
@keyframes waveL{0%,100%{transform:rotate(0)}15%,55%{transform:rotate(125deg)}35%,75%{transform:rotate(100deg)}}
@keyframes waveR{0%,100%{transform:rotate(0)}15%,55%{transform:rotate(-125deg)}35%,75%{transform:rotate(-100deg)}}
@keyframes hopL{50%{transform:rotate(70deg)}}
@keyframes hopR{50%{transform:rotate(-70deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.eyesClosed{opacity:0}
.sleep .eyesClosed,.yawn .eyesClosed{opacity:1}
.sleep .eyes,.yawn .eyes{opacity:0;animation:none}
.mouthOpen{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.talk .mouthOpen{animation:flap .2s ease-in-out infinite alternate}
.eat .mouthOpen{animation:chew .32s ease-in-out 7}
.yawn .mouthOpen{animation:yawn 1.5s ease-in-out}
.wide .mouthOpen{transform:scaleY(.75)}
@keyframes flap{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes chew{0%,100%{transform:scaleY(.1)}50%{transform:scaleY(.55)}}
@keyframes yawn{0%{transform:scaleY(0)}40%,70%{transform:scaleY(1.1)}100%{transform:scaleY(0)}}
.talk .smile,.eat .smile,.yawn .smile,.wide .smile{opacity:0}
.cheek{transform-box:fill-box;transform-origin:center}
.eat .cheek{animation:cheek .32s ease-in-out 7}
@keyframes cheek{50%{transform:scale(1.14)}}
.jar{opacity:0;transform-box:fill-box;transform-origin:center}
.eat .jar{animation:jar 2.4s ease-in-out}
@keyframes jar{0%{opacity:0;transform:translate(140px,60px) rotate(22deg)}20%,85%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(140px,60px) rotate(22deg)}}
.heart{fill:var(--berry);opacity:0;transform-box:fill-box;transform-origin:center}
.love .heart{animation:heart 1.9s ease-out both;animation-delay:var(--d)}
@keyframes heart{0%{opacity:0;transform:translate(0,22px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.1)}}
.z{opacity:0;font:400 30px var(--display);fill:#fff}
.sleep .z{animation:zz 2.8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes zz{0%{opacity:0;transform:translate(0,12px)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-28px)}}
.dirt circle{fill:#76512F;transition:opacity .15s}

/* tray and panels */
.controls,.panel{background:var(--panel);border-radius:28px 28px 0 0;box-shadow:0 -6px 0 rgba(74,44,26,.06),0 -2px 20px rgba(0,0,0,.04);padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));position:relative;z-index:5;flex:none}
.panel{max-height:52%;overflow-y:auto;overscroll-behavior:contain}
.row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2.2vw,14px)}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;margin:0;font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--berry);outline-offset:4px;border-radius:20px}
.disc{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.btn:active .disc{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.disc svg{width:26px;height:26px}
.main .disc{width:72px;height:72px}
.main .disc svg{width:36px;height:36px}
.d-eat{background:linear-gradient(145deg,#F0B030,#D98A10)} .d-play{background:linear-gradient(145deg,#3BB5AC,#208F88)} .d-closet{background:linear-gradient(145deg,#9B74D4,#7A4FB8)} .d-mic{background:linear-gradient(145deg,#F06A7A,#D04058)} .d-sleep{background:linear-gradient(145deg,#5B6BB0,#3A4A90)} .d-weather{background:linear-gradient(145deg,#6AB0E0,#3A8AC0)} .d-dance{background:linear-gradient(145deg,#E88AC0,#C060A0)}
.main.on .disc::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 calc(6px + var(--lv,0) * 28px) rgba(228,86,107,.28);transition:box-shadow .07s;pointer-events:none}
.lab{font:400 14px var(--display);letter-spacing:.02em;white-space:nowrap}
/* hints float above the tray so they never take up play space */
.note{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,6px);width:max-content;max-width:min(88vw,340px);box-sizing:border-box;margin:0;padding:8px 14px;border-radius:16px;background:rgba(61,36,20,.88);color:#FFF8EC;font-size:13px;line-height:1.5;text-align:center;text-wrap:balance;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:7}
.note.show{opacity:1;transform:translate(-50%,0)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.phead h2{margin:0;font:400 22px var(--display)}
.phead .grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:9px;padding-bottom:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:0;border-radius:16px;padding:9px 5px 8px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(74,44,26,.1);touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:0}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,44,26,.1)}
.card svg{width:50px;height:50px}
.card .nm{font:400 15px var(--display)}
.card small{font-size:11px;color:var(--muted);font-weight:700}
.card.on{background:#FFF0D0;box-shadow:0 4px 0 rgba(217,149,28,.4)}
.card.no{opacity:.62}
.card.nope{animation:nope .35s}
@keyframes nope{25%{translate:-5px 0}75%{translate:5px 0}}
.chip{border:0;border-radius:999px;background:var(--berry);color:#fff;font:400 17px var(--display);padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16);touch-action:manipulation}
.chip.alt{background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 rgba(74,44,26,.12)}
.chip.sm{font-size:14px;padding:6px 12px}
.chip.sel{background:var(--teal)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:118px}
.key{border:0;border-radius:12px 12px 16px 16px;background:var(--c);color:#fff;font:400 26px var(--display);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:0}
.key.lit,.key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18);filter:brightness(1.15)}
.phint{margin:8px 0 2px;text-align:center;font:400 16px var(--display);min-height:1.3em}
/* little-kid games */
.hands{opacity:0;transition:opacity .12s}
.hide .hands{opacity:1}
.hide .eyes{opacity:0;animation:none}
.cbox{position:absolute;left:0;top:0;width:80px;height:100px;transition:transform .45s ease;will-change:transform}
.cjar{position:absolute;left:18px;bottom:4px;width:44px;height:44px;opacity:0;transition:opacity .2s}
.cjar svg{width:100%;height:100%;display:block}
.cbox.show .cjar{opacity:1}
.cup{position:absolute;left:0;bottom:0;width:80px;height:90px;pointer-events:auto;cursor:pointer;touch-action:manipulation;transition:transform .35s ease;-webkit-tap-highlight-color:transparent}
.cup svg{width:100%;height:100%;display:block}
.cbox.up .cup{transform:translateY(-64px)}
.capples{position:absolute;left:0;right:0;top:29%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 20px}
.capple{width:54px;height:54px;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.capple svg{width:100%;height:100%;display:block}
.capple.hit{animation:hitjump .45s ease-out}
.capple.bounce{animation:hitjump .55s ease-out;animation-delay:var(--d)}
@keyframes hitjump{40%{transform:translateY(-22px) scale(1.12)}}
.cchoices{position:absolute;left:0;right:0;bottom:40%;display:flex;justify-content:center;gap:16px}
.cnum{width:78px;height:78px;border-radius:50%;border:0;background:var(--c);color:#fff;font:400 44px/1 var(--display);pointer-events:auto;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cnum:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.cnum[disabled]{opacity:.4;box-shadow:none}
.cnum.nope{animation:nope .35s}
.dcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:none;cursor:crosshair}
.palette{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 12px}
.pc{width:44px;height:44px;border-radius:50%;border:4px solid #fff;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:auto;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.pc.sel{transform:scale(1.18);border-color:var(--ink)}
.pc.tool{background:#fff;color:var(--ink);display:grid;place-items:center;border-color:#fff}
.pc.tool.sel{border-color:var(--ink)}
.pc.tool svg{width:22px;height:22px}
@media (max-height:600px){.bearwrap{height:60%}.bubble{top:13%;font-size:17px}}
@media (max-width:380px){.disc{width:46px;height:46px}.main .disc{width:66px;height:66px}.lab{font-size:13px}.row{gap:4px}}
@media (prefers-reduced-motion:reduce){.cloud,#bodyG,.eyes,.fl,.drop,.flake{animation:none!important}}
</style>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
  var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
  var bear=$('#bear'), bubble=$('#bubble'), note=$('#note'), stage=$('#stage'), fx=$('#fx'), bearwrap=$('#bearwrap');
  var head=$('#head'), belly=$('#belly'), bearAll=$('#bearAll'), armL=$('#armL'), armR=$('#armR'), jarG=$('#jar');
  var micBtn=$('#micBtn'), micLab=$('#micLab'), sleepLab=$('#sleepLab'), weatherLab=$('#weatherLab');
  var sleeping=false, eating=false, listening=false, micState='unknown', snoreT=null, sleepT=null, noteT=null, sayT=null, holdUntil=0;
  var ui='home', G=null, raf=0;
  var weather='sun'; // sun | rain | snow

  /* ---------- saved progress ---------- */
  var store={stars:20,owned:{},worn:{},muted:false};
  try{
    var raw=localStorage.getItem('xiongle.v3')||localStorage.getItem('xiongle.v2');
    if(raw){var o=JSON.parse(raw); if(o&&typeof o.stars==='number'){store.stars=o.stars; store.owned=o.owned||{}; store.worn=o.worn||{}; store.muted=!!o.muted}}
  }catch(e){}
  // All items free — force own everything
  function ensureOwned(){
    ITEMS.forEach(function(it){ store.owned[it.id]=true });
  }
  function save(){try{localStorage.setItem('xiongle.v3',JSON.stringify(store))}catch(e){}}

  /* ---------- helpers ---------- */
  function play(el,cls,ms){
    el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
    clearTimeout(el['_t'+cls]); el['_t'+cls]=setTimeout(function(){el.classList.remove(cls)},ms);
  }
  function idleText(){
    if(ui==='game'&&G&&G.hint) return G.hint;
    return sleeping?'呼……呼……':(listening?'我在听，你说吧':'点点我吧！');
  }
  function say(t,ms){
    bubble.textContent=t; clearTimeout(sayT); speak(t);
    sayT=setTimeout(function(){bubble.textContent=idleText()},ms||2200);
  }
  function showNote(t,ms){
    note.textContent=t; note.classList.add('show'); clearTimeout(noteT);
    noteT=setTimeout(function(){note.classList.remove('show')},ms||6000);
  }
  function hold(ms){holdUntil=Math.max(holdUntil,performance.now()+ms)}
  function setLevel(l){var v=l.toFixed(2); bear.style.setProperty('--lv',v); micBtn.style.setProperty('--lv',v)}
  function bind(el,fn){
    el.addEventListener('click',fn);
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
  }
  var STAR='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l3.8 8.4 9.2 1-6.9 6.1 2 9-8.1-4.7-8.1 4.7 2-9L3 12.4l9.2-1z" fill="#F2B72B" stroke="#C98A12" stroke-width="2" stroke-linejoin="round"/></svg>';

  /* ---------- sounds ---------- */
  var ctx=null, master=null;
  function audio(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=store.muted?0:.8; master.connect(ctx.destination);
      try{ if(navigator.audioSession) navigator.audioSession.type='playback' }catch(e){}
    }
    if(ctx.state!=='running'){ try{ var rp=ctx.resume(); if(rp&&rp.catch) rp.catch(function(){}) }catch(e){} }
    return ctx;
  }
  var SILENT='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA';
  var keepAlive=null, chkT=null;
  function unlock(){
    var c=audio(); if(!c) return;
    if(c.state!=='running'){
      try{var b=c.createBuffer(1,1,22050), sb=c.createBufferSource(); sb.buffer=b; sb.connect(c.destination); sb.start(0)}catch(e){}
    }
    try{
      if(!keepAlive){keepAlive=new Audio(SILENT); keepAlive.loop=true}
      if(keepAlive.paused&&!listening){var kp=keepAlive.play(); if(kp&&kp.catch) kp.catch(function(){})}
    }catch(e){}
    clearTimeout(chkT);
    chkT=setTimeout(function(){
      if(ctx&&ctx.state!=='running') showNote('好像没有声音：请关掉手机的静音键、调大音量，再点一下小熊。',8000);
    },900);
  }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,{passive:true})});
  function speak(t){
    if(store.muted||listening||!window.speechSynthesis||!t||/[呼♪]/.test(t)) return;
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.pitch=1.7; u.rate=.95; u.volume=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function chirp(t,f0,f1,dur,vol,type){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'triangle'; vol=vol||.22;
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function crunch(t){
    var n=Math.floor(ctx.sampleRate*.08), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var s=ctx.createBufferSource(); s.buffer=b;
    var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    var g=ctx.createGain(); g.gain.value=.5;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function tone(f){
    var c=audio(); if(!c) return; var t=c.currentTime;
    [[f,'sine',.28],[f*2,'triangle',.07]].forEach(function(p){
      var o=c.createOscillator(), g=c.createGain(); o.type=p[1]; o.frequency.value=p[0];
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p[2],t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.9);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.95);
    });
  }
  var PENTA=[523.25,587.33,659.25,783.99,880];
  var S={
    hum:function(){var c=audio();if(!c)return 0;var t=c.currentTime;chirp(t,420,560,.18);chirp(t+.2,560,420,.2);return 500},
    hello:function(){var c=audio();if(!c)return 0;var t=c.currentTime;chirp(t,500,800,.15);chirp(t+.18,800,600,.2);return 450},
    giggle:function(){var c=audio();if(!c)return 0;var t=c.currentTime;for(var i=0;i<5;i++)chirp(t+i*.11,700+i*40,1000+i*40,.09,.2);return 700},
    boing:function(){var c=audio();if(!c)return 0;var t=c.currentTime;chirp(t,300,900,.3,.25,'sine');chirp(t+.32,900,500,.2,.18,'sine');return 600},

  function stepApple(dt,W,H){

    }

    var lim=Math.max(0,W/2-r.w*.3); G.tx=clamp(G.tx,-lim,lim);
    G.bx+=(G.tx-G.bx)*Math.min(1,dt*9);

    bear.style.setProperty('--lean',clamp((G.tx-G.bx)*.08,-9,9).toFixed(1)+'deg');

        }

    bear.classList.toggle('wide',near);

  function stepBubble(dt,W,H){
    G.spawn-=dt;

      G.spawn=Math.max(.6,1-G.t*.008);
      var size=70+Math.random()*40, gold=Math.random()<.1, hue=Math.floor(Math.random()*360);

  var TRASH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>';

  /* ---------- listen and repeat (v5) ----------
     为什么推倒重写：
     1) v4 同时开了两条录音管线（原始 PCM + MediaRecorder 的 mp4/AAC），然后优先去解码
        mp4。iOS 上音频会话正在被麦克风占用时，AAC 编码器/解码器产出的东西经常是噪点，
        解出来就是一片“沙沙沙”。
     2) v4 还主动把 iPhone 的三道麦克风处理全关了（echoCancellation/noiseSuppression/
        autoGainControl = false）。iPhone 关掉这些以后拿到的是“裸麦”，底噪很大、音量很怪，
        录进去的主要内容就是噪声。
     3) 最后 playBack 还会把峰值硬拉到 0.55（最多放大 10 倍）。一段噪声被放大 10 倍，
        就是用户听到的那声长长的沙沙。
     v5 只保留一条管线：用音箱电平表看到的同一批原始采样当录音；
     保留 iOS 自带的麦克风处理；加噪声门；播之前先判断“这像不像人声”；用 Web Audio 播放。 */
  var VER='v5';
  var DEBUG=(function(){ try{ if(/[?&]debug/.test(location.search)) return true; return localStorage.getItem('xiongle.debug')==='1' }catch(e){ return false } })();
  function dbg(t){ if(DEBUG) showNote(t,15000) }
  function holdSet(ms){ holdUntil=performance.now()+ms }
  var stream=null, src=null, proc=null, zero=null;
  var speaking=false, ring=[], rec=[], recLen=0, silentN=0, noise=.004, calibN=0, calibMin=1, tStart=0, hotN=0;
  function resetRec(){speaking=false; ring=[]; rec=[]; recLen=0; silentN=0}

  /* 在桌面图标里（standalone）没法给网址加 ?debug，所以：连点小熊 5 下就能开关诊断行 */
  (function(){
    var taps=0, last=0;
    bear.addEventListener('click',function(){
      var now=Date.now(); if(now-last>1500) taps=0; last=now;
      if(++taps<5) return; taps=0;
      DEBUG=!DEBUG;
      try{ localStorage.setItem('xiongle.debug',DEBUG?'1':'0') }catch(e){}
      showNote(DEBUG?'录音诊断已打开：点“跟我说”会显示数据':'录音诊断已关闭',3500);
    },true);
  })();

  /* 只调用一次 getUserMedia，并保留 iPhone 自己的降噪/自动增益。
     （iOS 上第二次 getUserMedia 会把第一条流静音，所以绝不能连开两条。） */
  async function openMic(){
    var tries=[
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}},
      {audio:{echoCancellation:true,noiseSuppression:true}},
      {audio:true}
    ], lastErr=null;
    for(var i=0;i<tries.length;i++){
      try{ return await navigator.mediaDevices.getUserMedia(tries[i]) }catch(e){ lastErr=e }
    }
    throw lastErr||new Error('no-media');
  }

  function uiListening(on){
    listening=on;
    micBtn.classList.toggle('on',on); micBtn.setAttribute('aria-pressed',String(on));
    micLab.textContent=on?'我在听':'跟我说';
    bear.classList.toggle('listen',on);
    if(!on){setLevel(0); bear.classList.remove('hearing')}
    bubble.textContent=idleText();
  }
  async function startListen(){
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) throw new Error('no-media');
    var c=audio(); if(!c) throw new Error('no-audio');
    try{ if(keepAlive) keepAlive.pause() }catch(e){}   // 录音时不要有别的 <audio> 占着音频会话
    stream=await openMic();
    if(c.state!=='running'){ try{ await c.resume() }catch(e){} }
    src=c.createMediaStreamSource(stream);
    proc=c.createScriptProcessor(4096,1,1);
    zero=c.createGain(); zero.gain.value=0;
    src.connect(proc); proc.connect(zero); zero.connect(c.destination);
    resetRec(); calibN=0; calibMin=1; proc.onaudioprocess=onChunk;
    micState='ok'; if(window.speechSynthesis) speechSynthesis.cancel(); uiListening(true);
    showNote('小熊在听。对着手机说一句话，停一下，它就会学给你听。',5000);
    try{
      var g=stream.getAudioTracks()[0].getSettings();
      dbg(VER+' · 音频 '+c.sampleRate+'Hz · 麦克风 '+(g.sampleRate||'?')+'Hz · 降噪 '+(g.noiseSuppression===false?'关':'开')+' · 自动增益 '+(g.autoGainControl===false?'关':'开')+' · 单路 PCM');
    }catch(e){}
  }
  function stopListen(){
    if(proc){proc.onaudioprocess=null; try{proc.disconnect()}catch(e){}}
    if(src){try{src.disconnect()}catch(e){}}
    if(zero){try{zero.disconnect()}catch(e){}}
    if(stream){stream.getTracks().forEach(function(t){t.stop()})}
    proc=src=zero=stream=null; resetRec(); uiListening(false);
  }
  function onChunk(e){
    var input=e.inputBuffer.getChannelData(0), len=input.length, sr=ctx.sampleRate;
    if(performance.now()<holdUntil){resetRec(); setLevel(0); return}
    var sum=0; for(var i=0;i<len;i++) sum+=input[i]*input[i];
    var rms=Math.sqrt(sum/len);
    setLevel(Math.min(1,rms*6));
    /* 开头约 0.35 秒先听一下房间有多吵，作为噪声门的基准 */
    if(calibN<8){ calibMin=Math.min(calibMin,rms); calibN++; if(calibN===8) noise=Math.max(.0015,Math.min(.05,calibMin*1.2)); return }
    var th=Math.max(.014,noise*2.5), copy=new Float32Array(input);
    if(!speaking){
      if(rms<th) noise=Math.min(.05,noise*.95+rms*.05);
      ring.push(copy); if(ring.length>4) ring.shift();
      if(rms>th) hotN++; else hotN=0;
      if(hotN>=2){
        hotN=0; speaking=true; tStart=performance.now()-ring.length*len/sr*1000;
        rec=ring.slice(); ring=[]; silentN=0; recLen=rec.length*len;
        bear.classList.add('hearing');     // 只做视觉反馈：这时候放任何声音都会被麦克风录进去
      }
    }else{
      rec.push(copy); recLen+=len;
      if(rms<th*.7) silentN+=len; else silentN=0;
      if(silentN>sr*.65||recLen>sr*6){speaking=false; finish()}
    }
  }
  function finish(){
    var sr=ctx.sampleRate;
    var total=rec.reduce(function(n,a){return n+a.length},0)-Math.max(0,silentN-Math.round(.18*sr));
    var out=new Float32Array(Math.max(0,total)), o=0;
    for(var k=0;k<rec.length&&o<total;k++){
      var n=Math.min(rec[k].length,total-o); out.set(rec[k].subarray(0,n),o); o+=n;
    }
    rec=[]; ring=[]; silentN=0; recLen=0;
    bear.classList.remove('hearing');
    if(out.length<sr*.3){ return }
    var sq=0; for(var q=0;q<out.length;q++) sq+=out[q]*out[q];
    var level=Math.sqrt(sq/out.length);
    if(level<Math.max(.006,noise*1.8)){
      dbg('只录到环境声，已忽略（音量 '+level.toFixed(4)+'，底噪 '+noise.toFixed(4)+'）');
      bubble.textContent='没听清，再说一次'; holdSet(0); return;
    }
    /* 关键的一步：先判断这段录音到底是不是人声。沙沙声没有基频、自相关很低，
       人说话的自相关会明显偏高。不是人声就绝不播放，直接提示重说。 */
    var sp=speechness(out,sr);
    dbg('录音 '+(out.length/sr).toFixed(1)+' 秒 · 底噪 '+noise.toFixed(4)+' · 音量 '+level.toFixed(3)+' · 像人声 '+Math.round(sp*100)+'%');
    if(sp<.12){
      bubble.textContent='只听到沙沙声，再说一次';
      holdSet(0); return;
    }
    holdSet(9000);
    stopListen();                                        // 先关麦克风：iPhone 在录音状态下播出声音会被压得很怪
    setTimeout(function(){ playBack(out,sr) },200);
  }

  /* 0..1：像不像人声（周期性）。噪声/沙沙声几乎没有基频，得分会很低。 */
  function speechness(d,sr){
    var n=d.length; if(n<sr*.15) return 0;
    var win=Math.min(4096,n), hop=Math.max(1,win>>1), ws=[], s, i;
    for(s=0;s+win<=n;s+=hop){
      var e=0; for(i=0;i<win;i++) e+=d[s+i]*d[s+i];
      ws.push({s:s,e:e/win});
    }
    if(!ws.length) return 0;
    ws.sort(function(p,q){return q.e-p.e});
    var lo=Math.max(2,Math.round(sr/400)), hi=Math.min(win>>1,Math.round(sr/60)), top=0;
    for(var w=0;w<Math.min(3,ws.length);w++){        // 只看最响的 3 个窗口，避免挑到句子缝隙
      var at=ws[w].s;
      for(var lag=lo;lag<=hi;lag++){
        var x=0,y=0,z=0;
        for(i=0;i<win-lag;i++){ var a=d[at+i], b=d[at+i+lag]; x+=a*b; y+=a*a; z+=b*b }
        var r=(y>0&&z>0)?x/Math.sqrt(y*z):0;
        if(r>top) top=r;
      }
      if(top>.6) break;
    }
    return Math.max(0,Math.min(1,top));
  }

  /* 去掉直流/低频隆隆声 → 噪声门把安静段压下去 → 温和放大（最多 4 倍，绝不再把噪声拉成巨响） */
  function prepareClip(x,sr,floor){
    var n=x.length, i, j, a=.995, px=0, py=0;
    for(i=0;i<n;i++){ var v=x[i]; py=a*(py+v-px); px=v; x[i]=py }
    var blk=Math.max(32,Math.round(sr*.005)), g=1, gate=Math.max(.004,floor*1.8);
    for(i=0;i<n;i+=blk){
      var pk=0, end=Math.min(n,i+blk);
      for(j=i;j<end;j++) pk=Math.max(pk,Math.abs(x[j]));
      var target=pk<=gate?Math.max(.12,pk/gate*.6):1;
      g+=(target-g)*.5;
      for(j=i;j<end;j++) x[j]*=g;
    }
    var vals=[]; for(i=0;i<n;i+=7) vals.push(Math.abs(x[i]));
    vals.sort(function(p,q){return p-q});
    var peak=Math.max(.002,vals[Math.floor(vals.length*.98)]||.002);
    var gain=Math.max(.6,Math.min(6,.62/peak));
    for(i=0;i<n;i++) x[i]=Math.max(-.97,Math.min(.97,x[i]*gain));
    return {gain:gain,peak:peak};
  }

  /* 播放走 Web Audio（不经过 <audio>+blob，iPhone 上这条最稳） */
  function playBack(x,sr){
    var info=prepareClip(x,sr,noise);
    var rate=1.3, dur=x.length/sr/rate*1000;
    dbg('播放：音量 '+info.peak.toFixed(3)+'，放大 '+info.gain.toFixed(1)+' 倍，'+sr+'Hz，'+(x.length/sr).toFixed(1)+' 秒');
    bear.classList.add('talk'); bubble.textContent='学给你听！';
    holdSet(dur+900);
    var finished=false;
    function done(){
      if(finished) return; finished=true;
      bear.classList.remove('talk'); bear.classList.remove('hearing'); bubble.textContent=idleText(); gain({mood:3});
    }
    if(store.muted){ setTimeout(done,dur); return }
    try{
      try{ if(navigator.audioSession&&navigator.audioSession.type!=='playback') navigator.audioSession.type='playback' }catch(e1){}
      var c=ctx||audio();
      if(c.state!=='running'){ var rp=c.resume(); if(rp&&rp.catch) rp.catch(function(){}) }
      var buf=c.createBuffer(1,x.length,sr); buf.copyToChannel(x,0);
      var s=c.createBufferSource(); s.buffer=buf; s.playbackRate.value=rate;
      s.connect(master); s.onended=done; s.start();
      setTimeout(done,dur+1500);
    }catch(e){ viaAudioElement() }
    function viaAudioElement(){                       // 极少数情况下 Web Audio 播不出来才走这里
      if(finished) return;
      try{
        var el=new Audio();
        el.setAttribute('playsinline','');
        if(navigator.audioSession&&navigator.audioSession.type!=='playback') navigator.audioSession.type='playback';
        var url=URL.createObjectURL(toWav(x,sr));
        el.loop=false; el.src=url; el.playbackRate=rate; el.volume=1;
        el.onended=function(){ try{URL.revokeObjectURL(url)}catch(e3){}; done() };
        el.onerror=done;
        var p=el.play(); if(p&&p.catch) p.catch(done);
        setTimeout(done,dur+1500);
      }catch(e2){ done() }
    }
  }
  /* 只在兜底路径里用：把原始采样包成 16bit WAV，让 <audio> 能播 */
  function toWav(x,sr){
    var n=x.length, ab=new ArrayBuffer(44+n*2), v=new DataView(ab), i;
    function str(o,t){ for(var k=0;k<t.length;k++) v.setUint8(o+k,t.charCodeAt(k)) }
    str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVE'); str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,'data'); v.setUint32(40,n*2,true);
    for(i=0;i<n;i++){ var q=Math.max(-1,Math.min(1,x[i])); v.setInt16(44+i*2,q<0?q*32768:q*32767,true) }
    return new Blob([ab],{type:'audio/wav'});
  }
  function babble(){
    if(sleeping) wake();
    bear.classList.add('talk'); var ms=react(S.babble); say('咿咿呀呀～',ms);
    setTimeout(function(){bear.classList.remove('talk')},ms);
  }
  micBtn.addEventListener('click',async function(){
    if(sleeping) wake();
    if(listening){stopListen(); return}
    audio();
    if(micState==='no'){babble(); return}
    try{ await startListen(); }
    catch(err){
      micState='no';
      showNote('麦克风没打开：请在浏览器里允许麦克风。要放在 https 网址里才能录音，现在小熊先用咿呀声回答你。',9000);
      babble();
    }
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(listening) stopListen(); if(ui==='game') exitGame(); try{ if(keepAlive) keepAlive.pause() }catch(e){} }
  });

  /* ---------- slow changes ---------- */
  var lastHint=0;
  setInterval(function(){
    if(sleeping){ gain({energy:8}); if(st.energy>=100) wake(); return }
    if(ui==='game') return;
    gain({food:-1.2,mood:-1,energy:-.8});
    var now=Date.now();
    if(ui==='home'&&!listening&&!eating&&now-lastHint>40000){
      if(st.food<25){say('肚子咕咕叫～想吃东西',3000);lastHint=now}
      else if(st.energy<20){say('好困呀……想睡觉',3000);lastHint=now}
      else if(st.mood<25){say('有点无聊，陪我玩嘛',3000);lastHint=now}
    }
  },10000);

  var SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" fill-opacity=".25"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
  var SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" fill-opacity=".25"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function renderMute(){
    var b=$('#muteBtn'); b.innerHTML=store.muted?SPK_OFF:SPK_ON; b.setAttribute('aria-pressed',String(store.muted));
    if(master) master.gain.value=store.muted?0:.8;
  }
  $('#muteBtn').addEventListener('click',function(){
    store.muted=!store.muted; save(); renderMute();
    if(store.muted){ if(window.speechSynthesis) speechSynthesis.cancel() }
    else { audio(); react(S.hello); say('我又能说话啦！') }
  });
  renderMute();
  renderHud();
  showNote('点“跟我说”，小熊会用小宝宝的声音学你说话',6000);
})();
</script>

if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}) }) }
</script>
