<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="录音取证">
<meta name="theme-color" content="#101a2c">
<title>把录音存下来</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:16px 14px 40px;font:16px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#101a2c;color:#eef4ff}
h1{font-size:19px;margin:0 0 6px}
p.sub{margin:0 0 14px;color:#93a9c9;font-size:13px}
button{display:block;width:100%;margin:0 0 10px;padding:15px;font:600 16px/1.25 inherit;color:#08131f;background:#6fd3ff;border:0;border-radius:12px}
button.b2{background:#ffd166}
button.b3{background:#9be7c4}
button.b4{background:#3ddc84}
button:disabled{opacity:.45}
.card{background:#182541;border:1px solid #26385a;border-radius:14px;padding:12px 13px;margin:0 0 12px}
#big{font:700 18px/1.7 -apple-system,"PingFang SC",sans-serif}
canvas{width:100%;height:120px;background:#0b1220;border-radius:10px;display:block}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;color:#b8ffd9}
.hint{color:#8fa6c8;font-size:12.5px;margin:6px 0 0}
</style>
</head>
<body>
<h1>把真实录音存下来</h1>
<p class="sub">这一步是为了让工程师（我）直接看到你手机录到的东西本身，而不是继续猜。</p>

<div class="card" id="bigCard" style="display:none"><div id="big"></div></div>

<div class="card">
  <button id="b1">① 录 4 秒：说一句「今天天气很好」</button>
  <button id="b2" class="b2" disabled>② ▶ 原速播放（1.0 倍）</button>
  <button id="b3" class="b3" disabled>③ ▶ 变声播放（1.3 倍，小熊用的）</button>
  <button id="b4" class="b4" disabled>④ 📤 保存 / 分享这段录音（WAV）</button>
  <p class="hint">④ 会弹出分享菜单：选「微信 → 文件传输助手」，回到安卓微信里把它保存下来，然后在聊天里当附件发给我。</p>
</div>

<div class="card">
  <div style="color:#93a9c9;font-size:12.5px;margin-bottom:6px">频谱（横轴 80Hz→8kHz，纵轴能量）：平的一片＝噪声；左边几个高高的柱子＝人声</div>
  <canvas id="spec" width="330" height="120"></canvas>
</div>

<div class="card"><pre id="out">准备中…</pre></div>

<script>
(function(){
'use strict';
var AC=window.AudioContext||window.webkitAudioContext;
var out=document.getElementById('out'), spec=document.getElementById('spec'), sctx=spec.getContext('2d');
var big=document.getElementById('big'), bigCard=document.getElementById('bigCard');
var lines=[];
function log(t){ lines.push(t); out.textContent=lines.join('\n') }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms) }) }

var data=null, sr=0, wav=null, ctxP=null;

async function gUM(){
  var tries=[{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}},{audio:true}], last=null;
  for(var i=0;i<tries.length;i++){
    try{ return await navigator.mediaDevices.getUserMedia(tries[i]) }catch(e){ last=e }
  }
  throw last||new Error('getUserMedia 失败');
}
function mkCtx(rate){
  var c=null;
  if(rate){ try{ c=new AC({sampleRate:rate}) }catch(e){ c=null } }
  if(!c){ try{ c=new AC() }catch(e){ try{ c=new AC() }catch(e2){ return null } } }
  return c;
}

/* 用 Goertzel 算 24 个频段的能量，画成柱子 */
function spectrum(d,sr){
  var win=Math.min(8192,d.length), best=0, at=0, s, i;
  for(s=0;s+win<=d.length;s+=win>>1){ var e=0; for(i=0;i<win;i++) e+=d[s+i]*d[s+i]; if(e>best){best=e;at=s} }
  var bands=24, res=[];
  for(var b=0;b<bands;b++){
    var f0=80*Math.pow(100,f0x(b,bands)), f1=80*Math.pow(100,f0x(b+1,bands));
    var f=(f0+f1)/2, w=2*Math.PI*f/sr, cw=2*Math.cos(w), s1=0, s2=0;
    for(i=0;i<win;i++){ var s3=d[at+i]+cw*s1-s2; s2=s1; s1=s3 }
    res.push(Math.sqrt(s1*s1+s2*s2-cw*s1*s2)/win);
  }
  var mx=Math.max.apply(null,res)||1;
  return res.map(function(v){ return v/mx });
}
function f0x(b,bands){ return b/bands }          /* 80 * 100^x → 对数分布 80Hz..8kHz */
function drawBars(vals){
  var w=spec.width, h=spec.height, n=vals?vals.length:24;
  sctx.clearRect(0,0,w,h);
  var bw=w/n;
  for(var i=0;i<n;i++){
    var v=Math.max(0.02,vals?vals[i]:0), bh=v*(h-16);
    var g=sctx.createLinearGradient(0,h,0,h-bh);
    g.addColorStop(0,'#3ddc84'); g.addColorStop(1,'#6fd3ff');
    sctx.fillStyle=g;
    sctx.fillRect(i*bw+1,h-bh,bw-2,bh);
  }
}
drawBars(null);

function toWav(x,sr){
  var n=x.length, ab=new ArrayBuffer(44+n*2), v=new DataView(ab), i;
  function str(o,t){ for(var k=0;k<t.length;k++) v.setUint8(o+k,t.charCodeAt(k)) }
  str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVE'); str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,'data'); v.setUint32(40,n*2,true);
  for(i=0;i<n;i++){ var q=Math.max(-1,Math.min(1,x[i])); v.setInt16(44+i*2,q<0?q*32768:q*32767,true) }
  return new Blob([ab],{type:'audio/wav'});
}

document.getElementById('b1').onclick=async function(){
  var btn=this; btn.disabled=true;
  var stream=null;
  try{
    stream=await gUM();
    var g={}; try{ g=stream.getAudioTracks()[0].getSettings() }catch(e){}
    var rate=g.sampleRate||0;
    ctxP=mkCtx(rate);
    for(var t=0;t<4&&ctxP.state!=='running';t++){ try{ await ctxP.resume() }catch(e){}; await sleep(140) }
    sr=ctxP.sampleRate;
    log('上下文 '+ctxP.sampleRate+'Hz · 麦克风 '+(rate||'?')+'Hz · '+(rate&&Math.abs(rate-ctxP.sampleRate)<2?'✅对齐':'❌不对齐'));
    log('录音中…（现在说「今天天气很好」，说完等它自动结束）');
    var src=ctxP.createMediaStreamSource(stream), proc=ctxP.createScriptProcessor(4096,1,1), zero=ctxP.createGain();
    zero.gain.value=0; src.connect(proc); proc.connect(zero); zero.connect(ctxP.destination);
    var chunks=[];
    proc.onaudioprocess=function(e){ chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))) };
    await sleep(4000);
    proc.onaudioprocess=null;
    try{ proc.disconnect(); src.disconnect(); zero.disconnect() }catch(e){}
    var total=chunks.reduce(function(n,a){return n+a.length},0);
    data=new Float32Array(total); var o=0;
    chunks.forEach(function(a){ data.set(a,o); o+=a.length });
    var sq=0,pk=0; for(var i=0;i<data.length;i++){ sq+=data[i]*data[i]; pk=Math.max(pk,Math.abs(data[i])) }
    var rms=Math.sqrt(sq/Math.max(1,data.length));
    wav=toWav(data,sr);
    log('结果：'+ (data.length/sr).toFixed(2) +' 秒 · 音量 '+rms.toFixed(4)+' · 峰值 '+pk.toFixed(3)+' · 文件 '+(wav.size/1024|0)+' KB');
    big.innerHTML='时长 '+(data.length/sr).toFixed(1)+' 秒<br>音量 '+rms.toFixed(4)+' · 峰值 '+pk.toFixed(3)+'<br>'+
                  '采样率 '+sr+'Hz / 麦 '+(rate||'?')+'Hz';
    bigCard.style.display='block';
    drawBars(spectrum(data,sr));
    document.getElementById('b2').disabled=false;
    document.getElementById('b3').disabled=false;
    document.getElementById('b4').disabled=false;
  }catch(e){
    log('❌ 出错：'+(e&&e.message||e));
  }finally{
    try{ if(stream) stream.getTracks().forEach(function(t){t.stop()}) }catch(e){}
    btn.disabled=false;
    log('（先说一句，再点 ②③ 听，最后点 ④ 存下来发我）');
  }
};

function play(rate){
  if(!data) return;
  var c=ctxP;
  try{ if(c.state!=='running') c.resume() }catch(e){}
  var b=c.createBuffer(1,data.length,sr); b.copyToChannel(data,0);
  var s=c.createBufferSource(); s.buffer=b; s.playbackRate.value=rate; s.connect(c.destination); s.start();
}
document.getElementById('b2').onclick=function(){ play(1) };
document.getElementById('b3').onclick=function(){ play(1.3) };

document.getElementById('b4').onclick=async function(){
  if(!wav) return;
  var btn=this;
  try{
    var f=new File([wav],'xiaoxiong-'+(Date.now())+'.wav',{type:'audio/wav'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f],title:'小熊录音'}); log('✅ 已弹出分享菜单'); return }catch(e){ log('分享被取消，改用下载') }
    }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(wav); a.download='xiaoxiong.wav';
    document.body.appendChild(a); a.click(); a.remove();
    log('✅ 已保存到「文件」App（或浏览器下载目录）');
  }catch(e){ log('❌ 保存失败：'+(e&&e.message||e)) }
  btn.blur();
};
})();
</script>
</body>
</html>
